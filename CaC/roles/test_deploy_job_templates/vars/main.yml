---
# Test data: the Activity 1 Part B job template. cactest-ocp-credential
# (OpenShift or Kubernetes API Bearer Token) must exist; CaC never creates it.
controller_job_templates:  # noqa: var-naming[no-role-prefix]
  - name: cactest-ocp-template
    state: present  # present = create or update (default), absent = delete
    organization: Default
    description: Deploys the Automation Receipt on OpenShift. Managed by CaC.
    inventory: cactest-ocp-inventory
    project: cactest-nginx-project
    playbook: activities/activity01/webapp-openshift/receipt.yml
    execution_environment: Default execution environment
    credentials:
      - cactest-ocp-credential
    survey_enabled: true
    survey_spec:
      name: ""
      description: ""
      spec:
        - question_name: Namespace
          question_description: The OpenShift namespace to deploy to
          required: true
          type: text
          variable: AAP_NAMESPACE
          min: 0
          max: 1024
          default: ""
        - question_name: Webapp image
          question_description: The container image that serves the page
          required: false
          type: text
          variable: WEBAPP_IMAGE
          min: 0
          max: 1024
          default: docker.io/nginxinc/nginx-unprivileged:latest

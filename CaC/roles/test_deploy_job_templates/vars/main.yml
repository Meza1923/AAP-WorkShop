---
# Test data: one job template per activity playbook, with real lab values as
# survey defaults. Credentials must exist already; CaC never creates them.
controller_job_templates:  # noqa: var-naming[no-role-prefix]
  # Activity 1 Part A
  - name: cactest-nginx-template
    state: present  # present = create or update (default), absent = delete
    organization: Default
    description: Deploys nginx on my VM. Managed by CaC.
    inventory: cactest-nginx-inventory
    project: cactest-nginx-project
    playbook: activities/activity01/webapp-vm/nginx.yml
    execution_environment: Default execution environment
    credentials:
      - aws-bastion
    become_enabled: true
    survey_enabled: true
    survey_spec:
      name: ""
      description: ""
      spec:
        - question_name: Page title
          question_description: Title shown on the nginx page
          required: true
          type: text
          variable: page_title
          min: 0
          max: 1024
          default: Hello from the CaC test

  # Activity 1 Part B
  - name: cactest-ocp-template
    state: present  # present = create or update (default), absent = delete
    organization: Default
    description: Deploys the Automation Receipt on OpenShift. Managed by CaC.
    inventory: cactest-ocp-inventory
    project: cactest-nginx-project
    playbook: activities/activity01/webapp-openshift/receipt.yml
    execution_environment: Default execution environment
    credentials:
      - cactest-ocp-credential
    extra_vars:
      managed_by: cac
    survey_enabled: true
    survey_spec:
      name: ""
      description: ""
      spec:
        - question_name: Namespace
          question_description: The OpenShift namespace to deploy to
          required: true
          type: text
          variable: AAP_NAMESPACE
          min: 0
          max: 1024
          default: nginx-test-app
        - question_name: Webapp image
          question_description: The container image that serves the page
          required: false
          type: text
          variable: WEBAPP_IMAGE
          min: 0
          max: 1024
          default: docker.io/nginxinc/nginx-unprivileged:latest

  # Activity 2: the participant CaC playbook. Run as-is it stops at the
  # placeholder check, because the participant vars files hold placeholders.
  - name: cactest-cac-template
    state: present  # present = create or update (default), absent = delete
    organization: Default
    description: Applies the Activity 2 CaC configuration. Managed by CaC.
    inventory: cactest-ocp-inventory
    project: cactest-nginx-project
    playbook: activities/activity02/aap_config_as_code/deploy_main.yaml
    execution_environment: cac-image
    credentials:
      - aap

  # Activity 3. The token is the only answer to type: it is a secret and
  # must not be stored in this public repository.
  - name: admin-connect-alertmanager
    state: present  # present = create or update (default), absent = delete
    organization: Default
    description: Routes my AutomationReceiptDown alert to my EDA event stream.
    inventory: cactest-ocp-inventory
    project: cactest-nginx-project
    playbook: activities/activity03/connect-alertmanager/connect.yml
    execution_environment: Default execution environment
    credentials:
      - cactest-ocp-credential
    survey_enabled: true
    survey_spec:
      name: ""
      description: ""
      spec:
        - question_name: Namespace
          question_description: The OpenShift namespace of your app
          required: true
          type: text
          variable: AAP_NAMESPACE
          min: 0
          max: 1024
          default: nginx-test-app
        - question_name: Event stream URL
          question_description: The URL shown on your event stream in AAP
          required: true
          type: text
          variable: event_stream_url
          min: 0
          max: 1024
          # yamllint disable-line rule:line-length
          default: https://aap-aap.apps.cluster-vc4zx.vc4zx.sandbox2372.opentlc.com/eda-event-streams/api/eda/v1/external_event_stream/67617d5b-c42e-43aa-850b-4ca0cc66a341/post/
        - question_name: Event stream token
          question_description: The token in your Token Event Stream credential
          required: true
          type: password
          variable: event_stream_token
          min: 0
          max: 1024

---
controller_hosts:  # noqa: var-naming[no-role-prefix]
  - name: ec2-63-183-3-83.eu-central-1.compute.amazonaws.com
    state: present  # present = create or update (default), absent = delete
    inventory: linux-servers
    variables:
      nginx_port: 8080
  - name: vm01
    state: present  # present = create or update (default), absent = delete
    inventory: linux-servers
    variables:
      app: dev
  - name: vm02
    state: present  # present = create or update (default), absent = delete
    inventory: linux-servers
    variables:
      app: prod
  - name: windows01
    state: present  # present = create or update (default), absent = delete
    inventory: windows-servers
    variables:
      app: dev
  - name: windows02
    state: present  # present = create or update (default), absent = delete
    inventory: windows-servers
    variables:
      app: prod

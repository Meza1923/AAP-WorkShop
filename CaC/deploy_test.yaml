---
# Instructor test of the Activity 2 CaC flow, with real data for the lab AAP
# (organization Default, objects prefixed "cactest-"). Self-contained: this
# folder has its own roles and controller_vars.yml and does not depend on
# activities/activity02. The task files started as copies of the Activity 2
# ones, plus a two-pass filter (cac_pass) so deletions run in reverse order.
#
# Before running, create the credential cactest-ocp-credential by hand (see
# roles/test_deploy_job_templates/vars/main.yml). Run it from a job template
# with playbook CaC/deploy_test.yaml, the Default execution environment and a
# "Red Hat Ansible Automation Platform" credential.
- name: Configure Ansible Automation Platform (test data)
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - controller_vars.yml
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"

  tasks:
    - name: Show which commit this job applies
      ansible.builtin.debug:
        msg: >-
          Project revision used by this job:
          {{ awx_project_revision | default('not run from AAP') }}

    - name: Generate a temporary token for this run
      ansible.platform.token:
        description: "CaC test token, job {{ awx_job_id | default('') }}"
        scope: write
        state: present
        aap_hostname: "{{ controller_host }}"
        aap_username: "{{ aap_username }}"
        aap_password: "{{ aap_password }}"
        aap_validate_certs: "{{ controller_validate_certs }}"
      register: generated_token
      no_log: true

    - name: Apply the test configuration
      block:
        # Pass 1: delete the "state: absent" entries, users of an object
        # first (job templates, hosts, inventories, projects). Deleting an
        # inventory before its hosts would fail the host lookups.
        - name: Start the delete pass
          ansible.builtin.set_fact:
            cac_pass: absent

        - name: Delete job templates
          ansible.builtin.include_role:
            name: test_deploy_job_templates

        - name: Delete hosts
          ansible.builtin.include_role:
            name: test_deploy_hosts

        - name: Delete inventories
          ansible.builtin.include_role:
            name: test_deploy_inventories

        - name: Delete projects
          ansible.builtin.include_role:
            name: test_deploy_projects

        # Pass 2: create or update everything else, dependencies first.
        - name: Start the create and update pass
          ansible.builtin.set_fact:
            cac_pass: present

        - name: Deploy projects
          ansible.builtin.include_role:
            name: test_deploy_projects

        - name: Deploy inventories
          ansible.builtin.include_role:
            name: test_deploy_inventories

        - name: Deploy hosts
          ansible.builtin.include_role:
            name: test_deploy_hosts

        - name: Deploy job templates
          ansible.builtin.include_role:
            name: test_deploy_job_templates

      always:
        - name: Delete the temporary token
          ansible.platform.token:
            existing_token_id: >-
              {{ generated_token.ansible_facts.aap_token.id | string }}
            state: absent
            aap_hostname: "{{ controller_host }}"
            aap_username: "{{ aap_username }}"
            aap_password: "{{ aap_password }}"
            aap_validate_certs: "{{ controller_validate_certs }}"
          no_log: true

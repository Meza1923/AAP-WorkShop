---
# AAP connection settings. This file holds no secrets and no URL: the fork is
# public. The "Red Hat Ansible Automation Platform" credential attached to the
# job template injects aap_hostname, aap_username, aap_password and
# aap_validate_certs at run time.
controller_host: "{{ aap_hostname }}"
controller_validate_certs: "{{ aap_validate_certs | default(true) }}"

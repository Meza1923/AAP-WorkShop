---
# Activity 1, Part B: deploy the Automation Receipt on OpenShift. Auth comes
# only from the AAP credential; AAP_NAMESPACE has NO default (survey answer).
- name: Deploy the Automation Receipt
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    app_name: automation-receipt
    webapp_image: "{{ WEBAPP_IMAGE }}"
    app_namespace: "{{ AAP_NAMESPACE }}"
    webapp_html_path: /usr/share/nginx/html

  tasks:
    - name: Require AAP_NAMESPACE
      ansible.builtin.assert:
        that:
          - AAP_NAMESPACE is defined
          - AAP_NAMESPACE | string | length > 0
        fail_msg: >-
          Missing required variable 'AAP_NAMESPACE'. It comes from the survey
          on the job template. See the README, step 4 (Job template).
        quiet: true

    - name: Require WEBAPP_IMAGE
      ansible.builtin.assert:
        that:
          - WEBAPP_IMAGE is defined
          - WEBAPP_IMAGE | string | length > 0
        fail_msg: >-
          Missing required variable 'WEBAPP_IMAGE'. It comes from the survey
          on the job template. See the README, step 4 (Job template).
        quiet: true

    # AAP passes job metadata as awx_* (tower_* are the older names of the same data).
    # The fallback keeps the playbook usable outside AAP.
    - name: Collect job metadata and deployment time
      ansible.builtin.set_fact:
        receipt:
          job_id: "{{ awx_job_id | default(tower_job_id | default('not run from AAP')) }}"
          job_template: "{{ awx_job_template_name | default(tower_job_template_name | default('not run from AAP')) }}"
          user: "{{ awx_user_name | default(tower_user_name | default('not run from AAP')) }}"
          launch_type: "{{ awx_job_launch_type | default(tower_job_launch_type | default('not run from AAP')) }}"
          revision: "{{ awx_project_revision | default(tower_project_revision | default('not run from AAP')) }}"
          namespace: "{{ app_namespace }}"
          deployed_at: "{{ now(utc=true).strftime('%Y-%m-%d %H:%M:%S UTC') }}"

    # Workshop progress for the journey strip. Read-only: a missing object
    # means that activity has not been reached yet.
    - name: Read the app as it is before this run
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: "{{ app_name }}"
        namespace: "{{ app_namespace }}"
      register: current_deployment

    - name: Read the previous receipt
      kubernetes.core.k8s_info:
        api_version: v1
        kind: ConfigMap
        name: "{{ app_name }}"
        namespace: "{{ app_namespace }}"
      register: previous_receipt

    # Created in Activity 3. Not finding it (or not being allowed to read it)
    # only means EDA is not connected yet.
    - name: Check whether alerts are routed to EDA
      kubernetes.core.k8s_info:
        api_version: monitoring.coreos.com/v1beta1
        kind: AlertmanagerConfig
        name: "{{ app_name }}-eda"
        namespace: "{{ app_namespace }}"
      register: eda_route
      failed_when: false

    # managed_by=cac is set on the job template only through the Activity 2
    # CaC config. A Deployment with 0 available pods means this run restores it.
    - name: Work out the workshop progress
      ansible.builtin.set_fact:
        progress:
          cac: "{{ 'done' if (managed_by | default('')) == 'cac' else 'next' }}"
          eda: >-
            {{ 'done' if restored_at | length > 0
               else ('progress' if eda_connected | bool else 'next') }}
          restored_now: "{{ restored_now | bool }}"
          restored_at: "{{ restored_at }}"
      vars:
        restored_now: >-
          {{ current_deployment.resources | length > 0
             and (current_deployment.resources[0].status.availableReplicas
                  | default(0) | int) == 0 }}
        previous_restored_at: >-
          {{ (previous_receipt.resources | first | default({}))
             .get('metadata', {}).get('annotations', {})
             .get('receipt/eda-restored-at', '') }}
        restored_at: >-
          {{ receipt.deployed_at if restored_now | bool
             else previous_restored_at }}
        eda_connected: "{{ eda_route.resources | default([]) | length > 0 }}"

    # Route host = <launching user>.<apps domain>. The apps domain is taken from the
    # API URL that the credential injects (https://api.<cluster> -> apps.<cluster>).
    - name: Work out the Route host
      ansible.builtin.set_fact:
        route_host: >-
          {{ (receipt.user if receipt.user != 'not run from AAP' else app_namespace)
             | lower | regex_replace('[^a-z0-9-]', '-') }}.{{ apps_domain }}
      vars:
        apps_domain: >-
          {{ lookup('ansible.builtin.env', 'K8S_AUTH_HOST')
             | regex_replace('^https?://api[.]', 'apps.')
             | regex_replace('[:/].*$', '') }}

    - name: Check the Route host looks right
      ansible.builtin.assert:
        that:
          - route_host is match('^[a-z0-9-]+[.]apps[.]')
        fail_msg: >-
          Could not work out the apps domain from the API URL in the credential
          (got '{{ route_host }}'). Tell the instructor.
        quiet: true

    - name: Render index.html
      ansible.builtin.set_fact:
        receipt_html: "{{ lookup('ansible.builtin.template', 'index.html.j2') }}"

    - name: Deploy the ConfigMap with the receipt page
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: "{{ app_name }}"
            namespace: "{{ app_namespace }}"
            labels:
              app: "{{ app_name }}"
            annotations:
              receipt/eda-restored-at: "{{ progress.restored_at }}"
          data:
            index.html: "{{ receipt_html }}"

    - name: Deploy the Deployment
      kubernetes.core.k8s:
        state: present
        wait: true
        wait_timeout: 180
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: "{{ app_name }}"
            namespace: "{{ app_namespace }}"
            labels:
              app: "{{ app_name }}"
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: "{{ app_name }}"
            template:
              metadata:
                labels:
                  app: "{{ app_name }}"
                annotations:
                  receipt/checksum: "{{ receipt_html | hash('sha256') }}"
              spec:
                containers:
                  - name: web
                    image: "{{ webapp_image }}"
                    ports:
                      - containerPort: 8080
                    resources:
                      requests:
                        cpu: 20m
                        memory: 32Mi
                      limits:
                        cpu: 100m
                        memory: 64Mi
                    readinessProbe:
                      httpGet:
                        path: /
                        port: 8080
                      initialDelaySeconds: 2
                      periodSeconds: 5
                    livenessProbe:
                      httpGet:
                        path: /
                        port: 8080
                      initialDelaySeconds: 10
                      periodSeconds: 10
                    volumeMounts:
                      - name: html
                        mountPath: "{{ webapp_html_path }}"
                volumes:
                  - name: html
                    configMap:
                      name: "{{ app_name }}"

    - name: Deploy the Service
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: "{{ app_name }}"
            namespace: "{{ app_namespace }}"
            labels:
              app: "{{ app_name }}"
          spec:
            selector:
              app: "{{ app_name }}"
            ports:
              - name: http
                port: 8080
                targetPort: 8080

    - name: Deploy the Route
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: route.openshift.io/v1
          kind: Route
          metadata:
            name: "{{ app_name }}"
            namespace: "{{ app_namespace }}"
            labels:
              app: "{{ app_name }}"
          spec:
            host: "{{ route_host }}"
            to:
              kind: Service
              name: "{{ app_name }}"
            port:
              targetPort: http
            tls:
              termination: edge
              insecureEdgeTerminationPolicy: Redirect
      register: route

    # Used in Activity 3. No leaf-prometheus scope label: the rule needs the
    # kube-state-metrics series, which only the platform Prometheus has.
    - name: Deploy the alert rule
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: monitoring.coreos.com/v1
          kind: PrometheusRule
          metadata:
            name: "{{ app_name }}-alerts"
            namespace: "{{ app_namespace }}"
            labels:
              app: "{{ app_name }}"
          spec:
            groups:
              - name: "{{ app_name }}"
                rules:
                  - alert: AutomationReceiptDown
                    expr: >-
                      kube_deployment_status_replicas_available{
                      namespace="{{ app_namespace }}",
                      deployment="{{ app_name }}"} == 0
                    for: 1m
                    labels:
                      severity: critical
                      app: "{{ app_name }}"
                    annotations:
                      summary: >-
                        Automation Receipt is down in {{ app_namespace }}
                      description: >-
                        Deployment {{ app_name }} in namespace
                        {{ app_namespace }} has had zero available
                        replicas for 1 minute.

    - name: Verify the Route responds
      ansible.builtin.uri:
        url: "https://{{ route.result.spec.host }}/"
        validate_certs: false
        status_code: 200
      register: route_check
      until: route_check.status == 200
      retries: 10
      delay: 3
      changed_when: false

    - name: Show the URL to open in the browser
      ansible.builtin.debug:
        msg: "Open https://{{ route.result.spec.host }}/ in your browser."

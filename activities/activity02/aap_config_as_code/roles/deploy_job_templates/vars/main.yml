---
# Data only: the job templates in AAP. Credentials are referenced by name
# only. Names must match AAP exactly, or CaC creates duplicates.
controller_job_templates:  # noqa: var-naming[no-role-prefix]
  - name: <username>-nginx-template
    state: present  # present = create or update (default), absent = delete
    organization: <organization>
    description: Deploys nginx on my VM. Managed by CaC.
    inventory: <username>-nginx-inventory
    project: <username>-nginx-project
    playbook: activities/activity01/webapp-vm/nginx.yml
    execution_environment: Default execution environment
    credentials:
      - <username>-nginx-credential
    become_enabled: true
    survey_enabled: true
    survey_spec:
      name: ""
      description: ""
      spec:
        - question_name: Page title
          question_description: Title shown on the nginx page
          required: true
          type: text
          variable: page_title
          min: 0
          max: 1024
          default: ""
